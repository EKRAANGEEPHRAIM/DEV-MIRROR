<div class="min-h-screen    flex items-center justify-center bg-gray-950 px-4">


    <div class="w-full max-w-md">


        <!-- logo -->

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white">DevMirror</h1>
            <p class="text-gray-400 mt-2">Access your developper space</p>
        </div>


        <!-- Card -->
        <div class="bg-gray-900 border border-gray-800 rounded-lg p-3">
            <h2 class="text-3xl text-center font-semibold text-white mb-6">Connexion</h2>
        </div>


        <!-- API ERROR -->
        @if(apiError()) {
            <div class="bg-red-900/50 border border-red-700/30 rounded-lg p-4 mb-6">
                <p class="text-red-200">{{ apiError() }}</p>
            </div>
        }


        <form (ngSubmit)="onSubmit()"  #loginForm="ngForm" class="space-y-4">
            
                    <!-- Email -->
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Email</label>
          <input
            [(ngModel)]="form.email"
            name="email"
            type="email"
            placeholder="toi@exemple.com"
            class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2.5
                   placeholder-gray-500 focus:outline-none focus:border-violet-500 transition"
          />
          @if (errors().email) {
            <p class="text-red-400 text-xs mt-1">{{ errors().email }}</p>
          }
        </div>


                <!-- Password -->
        <div>
          <label class="block text-sm text-gray-400 mb-1.5">Password</label>
          <input
            [(ngModel)]="form.password"
            name="password"
            type="password"
            placeholder="••••••••"
            class="w-full bg-gray-800 border border-gray-700 text-white rounded-lg px-4 py-2.5
                   placeholder-gray-500 focus:outline-none focus:border-violet-500 transition"
          />
          @if (errors().password) {
            <p class="text-red-400 text-xs mt-1">{{ errors().password }}</p>
          }
        </div>


        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-violet-600 hover:bg-violet-500 text-white rounded-lg px-4 py-2.5 font-medium
                 transition disabled:opacity-50 disabled:cursor-not-allowed"
        >
          @if (loading()) {
            <span class="flex items-center justify-center">
              <span class="animate-spin rounded-full h-4 w-4 border-b-2 border-white mr-2"></span>
              Connexion...
            </span>
          } @else {
            To connect
          }
        </button>

        </form>


              <p class="text-center text-gray-500 text-sm mt-6">
        Don't have an account yet?
        <a routerLink="/auth/register" class="text-violet-400 hover:text-violet-300">
          Sign up
        </a>
      </p>

    </div>
</div>
